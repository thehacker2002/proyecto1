<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background"></div>
    <div class="container">
        <form class="glass-card" action="/register" method="post">
            <h2>Crear Cuenta</h2>
            <p>Entra manao hay buenos precios</p>

            <label for="fullname">Nombre Completo</label>
            <input type="text" id="fullname" placeholder="Saul Sanchez" required />

            <label for="email">Correo</label>
            <input type="email" id="email" placeholder="tu@ejemplo.com" required />

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="*********" required />

            <button type="submit">Registrar</button>

            <div class="footer">
                <p>Ya tienes una cuenta?
                    <a href="login.html">Inicio</a>
                </p>
            </div>

        </form>

    </div>

</body>

</html>
